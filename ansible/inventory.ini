# ==============================================================================
# Ansible Inventory for AWS EC2 Instances and Local Testing
# ==============================================================================

[staging]
# Replace with your Staging AWS EC2 Public IP or DNS
# Example: 54.210.100.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/aws-key.pem
staging-server ansible_host=54.210.100.50 ansible_user=ubuntu

[production]
# Replace with your Production AWS EC2 Public IP or DNS
prod-server-01 ansible_host=54.210.100.51 ansible_user=ubuntu
prod-server-02 ansible_host=54.210.100.52 ansible_user=ubuntu

[local]
# For testing Ansible deployment locally
localhost ansible_connection=local

[aws_servers:children]
staging
production

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
