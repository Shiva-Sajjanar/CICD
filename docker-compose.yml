services:
  devops-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-cicd-app:latest
    container_name: devops-cicd-container
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
